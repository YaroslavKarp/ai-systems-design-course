schema_version: "1.0"
proposal_id: lab01-boundary-distributed-systems
status: approved
personal_domain: distributed systems
intended_learning_outcome: Explain how distributed consensus and replication protocols preserve consistency
  and availability by tracing technical concepts to preserved source evidence.
non_goals:
  - Autonomously mutating or approving canonical vault knowledge without explicit student review and decision.
  - Implementing high-consequence automated decisions or building a live production distributed cluster.
governance:
  ai_role: Propose a bounded system description and expose uncertainty without accepting changes.
  deterministic_role: Validate the candidate, bind the decision to its digest, and apply only approved
    content.
  human_role: Review meaning and explicitly approve or reject the proposal before application.
usefulness_condition: The system answers technical learning questions by linking each verifiable statement
  directly to preserved canonical source records.
material_risk: The AI assistant proposes plausible but unsupported concept definitions or semantic relations
  that misrepresent the underlying source evidence.
non_ai_baseline: Manual indexing and keyword-based search over curated Markdown notes with explicit file
  links.
uncertainty: Whether the closed course relation vocabulary is sufficiently expressive to represent domain-specific
  technical concepts without ambiguity.
required_evidence:
  - A passing deterministic validation result confirming schema compliance and SHA-256 digest match.
  - A documented human semantic review confirming that proposed concepts and relations are accurately
    grounded in registered sources.
