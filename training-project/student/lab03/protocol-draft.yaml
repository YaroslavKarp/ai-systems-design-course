engineering_decision: "Чи має B замінити A для оцінюваної операції пропозиції поняття?"
hypothesis: "Явне правило опори лише на надане джерело зменшить непідтримані твердження U і збереже повноту підкріплених відповідей; це гіпотеза, а не результат."
semantic_acceptance: "Для кожної конфігурації щонайменше 6 із 8 запланованих позицій мають прийнятну відповідь S або Q. Знаменник — усі 8 позицій; невдалі, структурно некоректні та непридатні до оцінювання відповіді не входять до чисельника. Будь-яка категорія U є блокувальною."
blocking_failures: "Будь-яке суттєве непідтримане твердження з категорією U блокує відповідну конфігурацію."
operational_acceptance: "Кожна повернена відповідь має завершитися не пізніше ніж за 120 секунд від recorded started_at до finished_at. Невідома затримка не підтверджує цей критерій. Невідомі токени або вартість залишаються невідомими й не дають підстав заявляти економію."
tradeoff_rule: "Рекомендувати B лише якщо він проходить критерії прийняття, має кращий результат за рубрикою або усуває блокувальну відмову A, і немає відомого погіршення іншого виміряного важливого показника. Якщо A прийнятний, а перевагу B не доведено, залишити A. Невиміряні показники не вважати перевагою."
decision_rule:
  recommend-b: "B проходить критерії прийняття, не має блокувального U і демонструє виміряну перевагу без відомого погіршення іншого важливого показника."
  retain-a: "A прийнятний, а свідчень недостатньо, щоб обґрунтувати заміну на B."
  reject-both: "Обидві конфігурації порушують відомий блокувальний критерій."
  seek-more-evidence: "Результатів або вимірювань недостатньо для обґрунтованого вибору."
attempt_budget: 16
timing_boundary: "Для кожної поверненої спроби — інтервал від записаного started_at до finished_at; однакове визначення для A і B."
route:
  adapter: openrouter
  model_id: openrouter/free